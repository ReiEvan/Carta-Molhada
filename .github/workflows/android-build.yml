name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Opcional: dispara também quando você cria uma tag de versão (ex: v1.0.0)
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 1. Primeiro geramos o arquivo .love compactado do seu jogo automaticamente
      - name: Criar pacote .love
        uses: love-actions/love-actions-core@v1
        with:
          source-path: "."
          target-path: "./game.love"

      # 2. Usamos a Action oficial da comunidade para compilar o APK para Android
      - name: Compilar APK com Love2D
        id: build-android
        uses: love-actions/love-actions-android@v2
        with:
          app-name: "Ultima Gota"          # Nome que aparece no celular
          bundle-id: "com.seuusuario.ultimagota"    # Identificador único do app
          love-ref: "11.5"                       # Versão do Love2D que você usou (ex: 11.5 ou 11.4)
          love-package: "./game.love"          # Caminho do pacote gerado no passo anterior

      # 3. Salvamos o APK gerado para você poder baixar nos artefatos do GitHub
      - name: Enviar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: meu-jogo-apk
          path: ${{ steps.build-android.outputs.package-paths }}
