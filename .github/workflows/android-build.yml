name: Build Android AAB (Play Store)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código do Jogo
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compactar jogo para .love
        run: |
          zip -9 -r game.love . -x ".git*" ".github*" "*Thumbs.db" "*.DS_Store" "game.love" "build/*"

      - name: Clonar LÖVE Android e Injetar Jogo
        run: |
          git clone --recursive https://github.com/love2d/love-android.git love-android-src
          mkdir -p love-android-src/app/src/main/assets
          cp game.love love-android-src/app/src/main/assets/game.love

      - name: Configurar Package ID e Nome
        run: |
          cd love-android-src
          # Altera o ID do pacote no build.gradle principal do app
          sed -i 's/applicationId "org.love2d.android"/applicationId "com.seuusuario.ultimagota"/g' app/build.gradle

      - name: Compilar AAB com Gradle
        run: |
          cd love-android-src
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace

      - name: Guardar o AAB gerado
        uses: actions/upload-artifact@v4
        with:
          name: UltimaGota-PlayStore-AAB
          path: love-android-src/app/build/outputs/bundle/release/*.aab
