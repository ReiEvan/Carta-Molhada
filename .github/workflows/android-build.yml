name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Limpeza extrema de disco
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -a --volumes -f
          df -h
          
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Criar pacote .love
        uses: love-actions/love-actions-core@v1
        with:
          source-path: "."
          target-path: "./game.love"

      - name: Compilar APK com Love2D
        id: build-android
        uses: love-actions/love-actions-android@v2
        with:
          app-name: "Ultima Gota"
          bundle-id: "com.seuusuario.ultimagota"
          love-ref: "11.5"
          love-package: "./game.love"

      - name: Enviar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: meu-jogo-apk
          path: ${{ steps.build-android.outputs.package-paths }}
