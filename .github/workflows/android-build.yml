name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 🧹 Limpeza segura de espaço em disco (sem quebrar o runner)
      - name: Liberar espaço em disco de forma segura
        run: |
          echo "=== Espaço em disco ANTES da limpeza ==="
          df -h
          
          # Remove ferramentas pesadas que não usamos para compilar LÖVE
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$HOME/.dotnet"
          sudo rm -rf "$HOME/.rustup"
          
          echo "=== Espaço em disco DEPOIS da limpeza ==="
          df -h

      - name: Criar pacote .love
        uses: love-actions/love-actions-core@v1
        with:
          source-path: "."
          target-path: "./game.love"

      - name: Compilar APK com Love2D
        id: build-android
        uses: love-actions/love-actions-android@v2
        with:
          app-name: "Ultima Gota"
          bundle-id: "com.seuusuario.ultimagota"
          love-ref: "11.5"
          love-package: "./game.love"

      - name: Enviar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: meu-jogo-apk
          path: ${{ steps.build-android.outputs.package-paths }}
